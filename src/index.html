<title>Putzplan Proberäume</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: eine Spalte, Sticky-Kopf mit Raumwahl, darunter Monatskarten (neueste oben) */
  :root {
    --bg: #eef0f2;
    --surface: #ffffff;
    --fg: #1b1f24;
    --muted: #5d6670;
    --line: #d5dae0;
    --accent: #1f6f8b;
    --accent-fg: #ffffff;
    --ok: #2f7d4f;
    --ok-soft: #e3f2e8;
    --warn: #8a5a00;
    --warn-soft: #fbf0d9;
    --lock: #6b7280;
    --lock-soft: #e6e8eb;
    --danger: #b3261e;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-plate: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121619; --surface: #1b2125; --fg: #e8ecef; --muted: #9aa5ae; --line: #2e373d;
      --accent: #5fb3cf; --accent-fg: #0d1a20; --ok: #6cc28f; --ok-soft: #1d3326;
      --warn: #e5b45a; --warn-soft: #3a2f1a; --lock: #9aa3ad; --lock-soft: #262d33; --danger: #f2827a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121619; --surface: #1b2125; --fg: #e8ecef; --muted: #9aa5ae; --line: #2e373d;
    --accent: #5fb3cf; --accent-fg: #0d1a20; --ok: #6cc28f; --ok-soft: #1d3326;
    --warn: #e5b45a; --warn-soft: #3a2f1a; --lock: #9aa3ad; --lock-soft: #262d33; --danger: #f2827a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.45;
    -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--surface);
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Kopf */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
  .plate {
    flex: none; min-width: 56px; height: 56px; padding: 0 8px;
    display: grid; place-items: center;
    border: 2px solid var(--fg); border-radius: 8px;
    font-family: var(--font-plate); font-size: 26px; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
  }
  .plate.empty { border-style: dashed; color: var(--muted); border-color: var(--muted); }
  .head-text { min-width: 0; flex: 1; display: grid; gap: 4px; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  select {
    width: 100%; min-height: 44px; font: inherit; font-size: 17px; font-weight: 600;
    color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 0 10px;
  }

  main .wrap { display: grid; gap: 14px; padding-block: 16px 24px; }

  .hint {
    background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius);
    padding: 28px 20px; text-align: center; color: var(--muted);
  }
  .hint strong { display: block; color: var(--fg); font-size: 18px; margin-bottom: 4px; }

  /* Monatskarte */
  .month {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 14px; display: grid; gap: 10px;
  }
  .month.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .month.locked { background: var(--lock-soft); }
  .month-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .month h2 { margin: 0; font-size: 19px; text-wrap: balance; }
  .badge {
    font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap;
  }
  .badge.current { background: var(--accent); color: var(--accent-fg); }
  .badge.open { background: var(--warn-soft); color: var(--warn); }
  .badge.locked { background: var(--surface); color: var(--lock); border: 1px solid var(--line); }
  .badge.admin { background: var(--warn-soft); color: var(--warn); border: 1px solid var(--warn); }

  .tasks { display: grid; gap: 8px; }
  .task {
    display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
    cursor: pointer; user-select: none;
  }
  .task input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .box {
    flex: none; width: 28px; height: 28px; border-radius: 7px; border: 2px solid var(--muted);
    display: grid; place-items: center; background: var(--surface);
  }
  .box svg { width: 18px; height: 18px; opacity: 0; }
  .task-label { font-size: 17px; font-weight: 500; }
  .task:has(input:checked) { background: var(--ok-soft); border-color: var(--ok); }
  .task:has(input:checked) .box { background: var(--ok); border-color: var(--ok); }
  .task:has(input:checked) .box svg { opacity: 1; }
  .task:has(input:focus-visible) { outline: 3px solid var(--accent); outline-offset: 2px; }
  .task:has(input:disabled) { cursor: not-allowed; opacity: 0.7; }

  .comment { display: grid; gap: 4px; }
  .comment-top { display: flex; justify-content: space-between; font-size: 14px; color: var(--muted); }
  .comment-top span { font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea:focus-visible, select:focus-visible, button:focus-visible, input[type="password"]:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }
  textarea:disabled { opacity: 0.7; }

  /* Fuß / Admin */
  footer .wrap { display: grid; gap: 10px; padding-block: 8px 32px; color: var(--muted); font-size: 14px; }
  .proto { margin: 0; }
  .admin-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    min-height: 44px; padding: 0 16px; font: inherit; font-weight: 600; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .admin-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-form input {
    flex: 1 1 160px; min-width: 0; min-height: 44px; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px;
  }
  .admin-active { color: var(--warn); font-weight: 600; }
  .admin-error { color: var(--danger); margin: 0; }

  /* Rückmeldung */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
    background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); z-index: 20; transition: opacity 0.2s;
  }
  .toast.error { background: var(--danger); color: #fff; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<header>
  <div class="wrap">
    <div class="plate empty" id="plate" aria-hidden="true">–</div>
    <div class="head-text">
      <h1>Putzplan Proberäume</h1>
      <select id="room" aria-label="Proberaum wählen"></select>
    </div>
  </div>
</header>

<main>
  <div class="wrap" id="months" aria-live="polite"></div>
</main>

<footer>
  <div class="wrap">
    <p class="proto">Prototyp: Einträge werden nur auf diesem Gerät gespeichert.</p>
    <div class="admin-row" id="adminRow"></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<template id="monthTpl">
  <section class="month">
    <div class="month-head">
      <h2></h2>
      <span class="badge"></span>
    </div>
    <div class="tasks"></div>
    <div class="comment">
      <div class="comment-top"><label>Kommentar (optional)</label><span class="count"></span></div>
      <textarea maxlength="200" rows="2" placeholder="z. B. Staubsauger defekt"></textarea>
    </div>
  </section>
</template>

<script type="module">
  import {
    currentMonth, lastEditableDay, isLocked, listMonths, formatMonth, formatDay, parseRoom,
  } from './lock.js';

  const CONFIG = { roomCount: 30, startMonth: '2026-11', graceDays: 5, tz: 'Europe/Berlin' };
  const TASKS = [
    { key: 'putzen', label: 'Putzen' },
    { key: 'muell', label: 'Müll rausbringen' },
    { key: 'putzzeug', label: 'Putzzeug kaufen' },
  ];
  const MAX_COMMENT = 200;
  const KEY_DATA = 'putzplan-data';
  const KEY_ROOM = 'putzplan-raum';
  const KEY_ADMIN = 'putzplan-admin';
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" style="color:var(--surface)"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

  // Speicherschicht. Phase 1: localStorage. Phase 3: wird durch API-Aufrufe ersetzt.
  const store = {
    async load() {
      try {
        const raw = localStorage.getItem(KEY_DATA);
        const data = raw ? JSON.parse(raw) : null;
        if (data && data.version === 1 && typeof data.entries === 'object') return data;
      } catch { /* Speicher nicht verfügbar */ }
      return { version: 1, entries: {} };
    },
    async save(monat, raum, entry) {
      const data = await this.load();
      data.entries[monat] ??= {};
      data.entries[monat][String(raum)] = entry;
      localStorage.setItem(KEY_DATA, JSON.stringify(data)); // wirft, wenn blockiert
    },
    async checkAdmin(password) {
      return password === 'admin'; // Platzhalter, in Phase 4 serverseitig geprüft
    },
  };

  const safeGet = (s, k) => { try { return s.getItem(k); } catch { return null; } };
  const safeSet = (s, k, v) => { try { v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* ignorieren */ } };

  const state = {
    data: { version: 1, entries: {} },
    room: null,
    adminPassword: safeGet(sessionStorage, KEY_ADMIN),
    adminFormOpen: false,
    adminError: '',
  };

  const $ = (id) => document.getElementById(id);

  function entryFor(monat, raum) {
    const e = state.data.entries[monat]?.[String(raum)] ?? {};
    return {
      putzen: e.putzen === true, muell: e.muell === true, putzzeug: e.putzzeug === true,
      kommentar: typeof e.kommentar === 'string' ? e.kommentar : '',
    };
  }

  const canEdit = (monat) => !isLocked(monat, new Date(), CONFIG.graceDays, CONFIG.tz) || !!state.adminPassword;

  let toastTimer;
  function toast(text, isError = false) {
    const el = $('toast');
    el.textContent = text;
    el.classList.toggle('error', isError);
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, isError ? 3500 : 1500);
  }

  async function saveEntry(monat, raum, patch) {
    if (!canEdit(monat)) {
      toast(`${formatMonth(monat)} ist gesperrt und kann nicht mehr geändert werden.`, true);
      renderMonths();
      return;
    }
    const entry = { ...entryFor(monat, raum), ...patch };
    entry.kommentar = entry.kommentar.slice(0, MAX_COMMENT);
    try {
      await store.save(monat, raum, entry);
      state.data.entries[monat] ??= {};
      state.data.entries[monat][String(raum)] = entry;
      toast('Gespeichert');
    } catch {
      toast('Speichern fehlgeschlagen. Bitte erneut versuchen.', true);
      renderMonths();
    }
  }

  function renderRoomSelect() {
    const sel = $('room');
    const opts = [new Option('Proberaum wählen', '')];
    for (let i = 1; i <= CONFIG.roomCount; i++) opts.push(new Option(`Proberaum ${i}`, String(i)));
    sel.replaceChildren(...opts);
    sel.value = state.room ? String(state.room) : '';
  }

  function renderPlate() {
    const plate = $('plate');
    plate.textContent = state.room ? String(state.room) : '–';
    plate.classList.toggle('empty', !state.room);
  }

  function renderMonths() {
    const container = $('months');
    if (!state.room) {
      const hint = document.createElement('div');
      hint.className = 'hint';
      const strong = document.createElement('strong');
      strong.textContent = 'Bitte Proberaum wählen';
      hint.append(strong, 'Danach siehst du die Aufgaben pro Monat und kannst sie abhaken.');
      container.replaceChildren(hint);
      return;
    }

    const now = new Date();
    const thisMonth = currentMonth(now, CONFIG.tz);
    const months = listMonths(CONFIG.startMonth, now, CONFIG.tz);
    const tpl = $('monthTpl');

    container.replaceChildren(...months.map((monat) => {
      const node = tpl.content.firstElementChild.cloneNode(true);
      const locked = isLocked(monat, now, CONFIG.graceDays, CONFIG.tz);
      const editable = !locked || !!state.adminPassword;
      const raum = state.room; // beim Rendern festhalten, damit verzögertes Speichern den richtigen Raum trifft
      const entry = entryFor(monat, raum);
      const idBase = `m${monat.replace('-', '')}`;

      node.querySelector('h2').textContent = formatMonth(monat);
      const badge = node.querySelector('.badge');
      if (monat === thisMonth) { badge.textContent = 'aktuell'; badge.classList.add('current'); node.classList.add('current'); }
      else if (!locked) { badge.textContent = `offen bis ${formatDay(lastEditableDay(monat, CONFIG.graceDays))}`; badge.classList.add('open'); }
      else if (state.adminPassword) { badge.textContent = 'gesperrt (Admin-Bearbeitung)'; badge.classList.add('admin'); }
      else { badge.textContent = 'gesperrt 🔒'; badge.classList.add('locked'); node.classList.add('locked'); }

      const tasks = node.querySelector('.tasks');
      for (const t of TASKS) {
        const label = document.createElement('label');
        label.className = 'task';
        const input = document.createElement('input');
        input.type = 'checkbox';
        input.id = `${idBase}-${t.key}`;
        input.checked = entry[t.key];
        input.disabled = !editable;
        input.addEventListener('change', () => saveEntry(monat, raum, { [t.key]: input.checked }));
        const box = document.createElement('span');
        box.className = 'box';
        box.innerHTML = CHECK_SVG; // statisches SVG, keine Nutzerdaten
        const text = document.createElement('span');
        text.className = 'task-label';
        text.textContent = t.label;
        label.append(input, box, text);
        tasks.append(label);
      }

      const ta = node.querySelector('textarea');
      const count = node.querySelector('.count');
      ta.id = `${idBase}-kommentar`;
      node.querySelector('.comment label').htmlFor = ta.id;
      ta.value = entry.kommentar;
      ta.disabled = !editable;
      count.textContent = `${ta.value.length}/${MAX_COMMENT}`;
      let timer;
      let lastSaved = entry.kommentar;
      const flush = () => {
        clearTimeout(timer);
        if (ta.value === lastSaved) return;
        lastSaved = ta.value;
        saveEntry(monat, raum, { kommentar: ta.value });
      };
      ta.addEventListener('input', () => {
        count.textContent = `${ta.value.length}/${MAX_COMMENT}`;
        clearTimeout(timer);
        timer = setTimeout(flush, 600);
      });
      ta.addEventListener('blur', flush);

      return node;
    }));
  }

  function renderAdmin() {
    const row = $('adminRow');
    if (state.adminPassword) {
      const info = document.createElement('span');
      info.className = 'admin-active';
      info.textContent = 'Admin-Modus aktiv';
      const out = document.createElement('button');
      out.type = 'button';
      out.textContent = 'Abmelden';
      out.addEventListener('click', () => {
        state.adminPassword = null;
        safeSet(sessionStorage, KEY_ADMIN, null);
        renderAdmin(); renderMonths();
      });
      row.replaceChildren(info, out);
      return;
    }
    if (!state.adminFormOpen) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = 'Admin';
      btn.addEventListener('click', () => { state.adminFormOpen = true; renderAdmin(); $('adminPw').focus(); });
      row.replaceChildren(btn);
      return;
    }
    const form = document.createElement('form');
    form.className = 'admin-form';
    const pw = document.createElement('input');
    pw.type = 'password'; pw.id = 'adminPw'; pw.autocomplete = 'current-password';
    pw.placeholder = 'Admin-Passwort'; pw.setAttribute('aria-label', 'Admin-Passwort');
    const ok = document.createElement('button');
    ok.type = 'submit'; ok.className = 'primary'; ok.textContent = 'Anmelden';
    const cancel = document.createElement('button');
    cancel.type = 'button'; cancel.textContent = 'Abbrechen';
    cancel.addEventListener('click', () => { state.adminFormOpen = false; state.adminError = ''; renderAdmin(); });
    form.append(pw, ok, cancel);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (await store.checkAdmin(pw.value)) {
        state.adminPassword = pw.value;
        state.adminFormOpen = false; state.adminError = '';
        safeSet(sessionStorage, KEY_ADMIN, pw.value);
        renderAdmin(); renderMonths();
        toast('Admin-Modus aktiv');
      } else {
        state.adminError = 'Passwort falsch.';
        renderAdmin();
      }
    });
    const nodes = [form];
    if (state.adminError) {
      const err = document.createElement('p');
      err.className = 'admin-error'; err.textContent = state.adminError;
      nodes.push(err);
    }
    row.replaceChildren(...nodes);
  }

  async function init() {
    const fromUrl = parseRoom(new URLSearchParams(location.search).get('raum'), CONFIG.roomCount);
    const remembered = parseRoom(safeGet(localStorage, KEY_ROOM), CONFIG.roomCount);
    state.room = fromUrl ?? remembered;
    if (fromUrl) safeSet(localStorage, KEY_ROOM, String(fromUrl));
    state.data = await store.load();

    renderRoomSelect(); renderPlate(); renderMonths(); renderAdmin();

    $('room').addEventListener('change', (ev) => {
      state.room = parseRoom(ev.target.value, CONFIG.roomCount);
      safeSet(localStorage, KEY_ROOM, state.room ? String(state.room) : null);
      renderPlate(); renderMonths();
    });
  }

  init();
</script>
