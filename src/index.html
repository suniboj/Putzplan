<title>Toilettenplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: Emailleschild als Kopf, darunter eine Fliesenwand (Zeilen = Monate, Spalten = Aufgaben),
     jede Aufgabe mit eigener Glasur; erledigte Kacheln sind glasiert und tragen die Raumnummern. */
  :root {
    --wall: #dfe5e3;          /* Fuge / Hintergrund */
    --tile: #f7f9f8;          /* unglasierte Kachel */
    --tile-edge: #c3ccc9;
    --ink: #17222b;
    --ink-soft: #55626b;
    --enamel: #1d4f8c;        /* Emailleschild */
    --enamel-ink: #f4f7fb;
    --glaze-putzen: #1f8a76;
    --glaze-muell: #a66d00;
    --glaze-putzzeug: #b4473a;
    --glaze-ink: #ffffff;
    --matte: #e9ecea;         /* gesperrte Kachel */
    --hatch: #d3d9d7;
    --danger: #b3261e;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-num: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --grout: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #0d1316; --tile: #1b2428; --tile-edge: #2b373c; --ink: #e9eef0; --ink-soft: #9aa8ae;
      --enamel: #2c64a8; --enamel-ink: #f4f7fb;
      --glaze-putzen: #2aa58e; --glaze-muell: #d99b1c; --glaze-putzzeug: #cc5a4c; --glaze-ink: #0b1215;
      --matte: #141b1e; --hatch: #1f292d; --danger: #f2827a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --wall: #0d1316; --tile: #1b2428; --tile-edge: #2b373c; --ink: #e9eef0; --ink-soft: #9aa8ae;
    --enamel: #2c64a8; --enamel-ink: #f4f7fb;
    --glaze-putzen: #2aa58e; --glaze-muell: #d99b1c; --glaze-putzzeug: #cc5a4c; --glaze-ink: #0b1215;
    --matte: #141b1e; --hatch: #1f292d; --danger: #f2827a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--wall); color: var(--ink); font-family: var(--font);
    font-size: 16px; line-height: 1.4; -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--wall);
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Kopf: Emailleschild */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--wall); padding-block: 10px;
  }
  .sign {
    display: flex; align-items: center; gap: 12px;
    background: var(--enamel); color: var(--enamel-ink);
    border-radius: 14px; padding: 10px 12px 10px 10px;
    box-shadow: inset 0 0 0 3px var(--enamel), inset 0 0 0 5px var(--enamel-ink), 0 2px 0 rgb(0 0 0 / 0.15);
  }
  .wc {
    flex: none; font-weight: 900; font-size: 30px; letter-spacing: 0.02em; line-height: 1;
    padding: 6px 10px; border: 3px solid var(--enamel-ink); border-radius: 10px;
  }
  .sign-text { min-width: 0; flex: 1; display: grid; gap: 4px; }
  h1 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.85; }
  select {
    width: 100%; min-height: 44px; font: inherit; font-size: 17px; font-weight: 800;
    color: var(--enamel); background: var(--enamel-ink); border: 0; border-radius: 8px; padding: 0 10px;
  }

  main .wrap { display: grid; gap: 20px; padding-block: 6px 24px; }
  .notice {
    margin: 0; padding: 10px 14px; border-radius: 10px; background: var(--tile);
    border: 2px dashed var(--enamel); color: var(--ink); font-weight: 600;
  }
  .help { margin: 0; color: var(--ink-soft); font-size: 14px; }

  /* Fliesenwand */
  table {
    width: 100%; table-layout: fixed; border-collapse: separate; border-spacing: var(--grout);
    margin: calc(var(--grout) * -1); width: calc(100% + 2 * var(--grout));
  }
  col.c-month { width: 25%; }
  thead th {
    font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-soft); text-align: center; padding: 0 0 2px; line-height: 1.15;
  }
  thead th:first-child { text-align: left; }
  thead th span { display: block; height: 4px; border-radius: 2px; margin: 4px auto 0; width: 60%; }
  tbody th, td {
    background: var(--tile); border-radius: 6px; padding: 0;
    box-shadow: inset 0 -2px 0 var(--tile-edge);
  }
  tbody th { text-align: left; padding: 8px 6px 8px 10px; vertical-align: middle; }
  .m-name { display: block; font-weight: 900; font-size: 15px; line-height: 1.1; }
  .m-year { display: block; font-size: 12px; font-weight: 700; color: var(--ink-soft); }
  .m-state { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: 0.02em; }
  .m-state.current { background: var(--enamel); color: var(--enamel-ink); padding: 1px 6px; border-radius: 4px; }
  .m-state.open { color: var(--glaze-muell); }
  .m-state.locked { color: var(--ink-soft); }

  tr.locked > th, tr.locked > td {
    background: repeating-linear-gradient(135deg, var(--matte) 0 6px, var(--hatch) 6px 8px);
    box-shadow: none;
  }
  tr.current > th { box-shadow: inset 0 0 0 2px var(--enamel); }

  .cell {
    width: 100%; aspect-ratio: 1 / 1; min-height: 64px; padding: 6px;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center;
    gap: 2px 6px; border-radius: 6px; background: transparent;
  }
  button.cell { font: inherit; color: var(--ink); border: 0; cursor: pointer; }
  button.cell:active { transform: translateY(1px); }
  td.done .cell { color: var(--glaze-ink); }
  td.done[data-task="putzen"] { background: var(--glaze-putzen); }
  td.done[data-task="muell"] { background: var(--glaze-muell); }
  td.done[data-task="putzzeug"] { background: var(--glaze-putzzeug); }
  td.done { box-shadow: inset 0 -3px 0 rgb(0 0 0 / 0.18), inset 0 2px 0 rgb(255 255 255 / 0.25); }
  tr.locked td.done { opacity: 0.75; }

  .chip {
    display: inline-flex; align-items: center; font-family: var(--font-num); font-weight: 900;
    font-size: 22px; line-height: 1; font-variant-numeric: tabular-nums;
  }
  .chip.mine { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 4px; }
  .cell:has(.chip:nth-of-type(3)) .chip { font-size: 16px; }
  .add { color: var(--ink-soft); font-size: 26px; font-weight: 300; line-height: 1; }
  td.done .add { color: var(--glaze-ink); opacity: 0.8; font-size: 20px; }
  .dash { color: var(--ink-soft); }

  /* Admin-Kachel */
  .chip button, .admin-add { font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; }
  .chip button { font-size: 16px; padding: 4px 2px 4px 3px; line-height: 1; }
  .admin-add {
    min-width: 44px; min-height: 32px; border: 2px dashed currentColor; border-radius: 999px;
    font-weight: 900; font-size: 14px; color: var(--ink-soft);
  }
  td.done .admin-add { color: var(--glaze-ink); }

  /* Kommentare */
  section h2 { margin: 0 0 8px; font-size: 13px; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .editor {
    background: var(--tile); border-radius: 10px; padding: 12px; display: grid; gap: 8px;
    box-shadow: inset 0 -2px 0 var(--tile-edge);
  }
  .editor select { background: var(--wall); color: var(--ink); }
  .editor-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; color: var(--ink-soft); }
  .editor-top span { font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--ink);
    background: var(--wall); border: 0; border-radius: 8px; padding: 10px 12px;
  }
  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--grout); }
  .comments li {
    background: var(--tile); border-radius: 8px; padding: 8px 12px; overflow-wrap: anywhere;
    box-shadow: inset 0 -2px 0 var(--tile-edge);
  }
  .c-meta { display: block; font-size: 12px; font-weight: 800; letter-spacing: 0.04em; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); margin: 0; }

  textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--enamel); outline-offset: 2px;
  }

  /* Fuß */
  footer .wrap { display: grid; gap: 10px; padding-block: 4px 32px; color: var(--ink-soft); font-size: 14px; }
  .proto { margin: 0; }
  .admin-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    min-height: 44px; padding: 0 16px; font: inherit; font-weight: 800; border-radius: 8px;
    border: 2px solid var(--tile-edge); background: var(--tile); color: var(--ink); cursor: pointer;
  }
  .btn.primary { background: var(--enamel); color: var(--enamel-ink); border-color: var(--enamel); }
  .admin-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-form input {
    flex: 1 1 160px; min-width: 0; min-height: 44px; font: inherit; color: var(--ink);
    background: var(--tile); border: 2px solid var(--tile-edge); border-radius: 8px; padding: 0 12px;
  }
  .admin-active { color: var(--enamel); font-weight: 800; }
  .admin-error { color: var(--danger); margin: 0; font-weight: 700; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 10px;
    background: var(--enamel); color: var(--enamel-ink); font-weight: 800; font-size: 15px; text-align: center;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.25); z-index: 20;
  }
  .toast.error { background: var(--danger); color: #fff; }
  @media (prefers-reduced-motion: reduce) { button.cell:active { transform: none; } }
</style>

<header>
  <div class="wrap">
    <div class="sign">
      <div class="wc" aria-hidden="true">WC</div>
      <div class="sign-text">
        <h1>Toilettenplan</h1>
        <select id="room" aria-label="Eigenen Proberaum wählen"></select>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="notice" id="notice" hidden>Wähle oben deinen Proberaum, um etwas einzutragen.</p>
    <div>
      <table>
        <colgroup><col class="c-month"><col><col><col></colgroup>
        <thead>
          <tr>
            <th scope="col">Monat</th>
            <th scope="col">Putzen<span style="background:var(--glaze-putzen)"></span></th>
            <th scope="col">Müll<span style="background:var(--glaze-muell)"></span></th>
            <th scope="col">Putz&shy;zeug<span style="background:var(--glaze-putzzeug)"></span></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="help" id="help"></p>

    <section id="editorSection" hidden>
      <h2>Dein Kommentar</h2>
      <div class="editor">
        <select id="commentMonth" aria-label="Monat für Kommentar"></select>
        <div class="editor-top"><label for="comment" id="commentLabel">Kommentar</label><span id="commentCount"></span></div>
        <textarea id="comment" maxlength="200" rows="2" placeholder="z. B. Klopapier fast leer"></textarea>
      </div>
    </section>

    <section>
      <h2>Kommentare</h2>
      <ul class="comments" id="comments"></ul>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="proto">Prototyp: Einträge werden nur auf diesem Gerät gespeichert.</p>
    <div class="admin-row" id="adminRow"></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
  import {
    currentMonth, lastEditableDay, isLocked, listMonths, formatMonth, formatMonthShort, formatDay, parseRoom,
  } from './lock.js';

  const CONFIG = { roomCount: 30, startMonth: '2026-11', graceDays: 5, tz: 'Europe/Berlin' };
  const TASKS = [
    { key: 'putzen', label: 'Putzen' },
    { key: 'muell', label: 'Müll rausbringen' },
    { key: 'putzzeug', label: 'Putzzeug kaufen' },
  ];
  const MAX_COMMENT = 200;
  const KEY_DATA = 'putzplan-data';
  const KEY_ROOM = 'putzplan-raum';
  const KEY_ADMIN = 'putzplan-admin';

  // Speicherschicht. Phase 1: localStorage. Phase 3: wird durch API-Aufrufe ersetzt.
  const store = {
    async load() {
      try {
        const raw = localStorage.getItem(KEY_DATA);
        const data = raw ? JSON.parse(raw) : null;
        if (data && data.version === 1 && data.entries && typeof data.entries === 'object') return data;
      } catch { /* Speicher nicht verfügbar */ }
      return { version: 1, entries: {} };
    },
    async save(monat, raum, entry) {
      const data = await this.load();
      data.entries[monat] ??= {};
      data.entries[monat][String(raum)] = entry;
      localStorage.setItem(KEY_DATA, JSON.stringify(data)); // wirft, wenn blockiert
    },
    async checkAdmin(password) {
      return password === 'admin'; // Platzhalter, in Phase 4 serverseitig geprüft
    },
  };

  const safeGet = (s, k) => { try { return s.getItem(k); } catch { return null; } };
  const safeSet = (s, k, v) => { try { v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* ignorieren */ } };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...children);
    return n;
  };

  const state = {
    data: { version: 1, entries: {} },
    room: null,
    adminPassword: safeGet(sessionStorage, KEY_ADMIN),
    adminFormOpen: false,
    adminError: '',
    commentMonth: null,
  };

  function entryFor(monat, raum) {
    const e = state.data.entries[monat]?.[String(raum)] ?? {};
    return {
      putzen: e.putzen === true, muell: e.muell === true, putzzeug: e.putzzeug === true,
      kommentar: typeof e.kommentar === 'string' ? e.kommentar : '',
    };
  }

  /** Räume (aufsteigend), die im Monat die Aufgabe erledigt haben. */
  function roomsFor(monat, key) {
    return Object.entries(state.data.entries[monat] ?? {})
      .filter(([, e]) => e && e[key] === true)
      .map(([r]) => Number(r))
      .filter((r) => r >= 1 && r <= CONFIG.roomCount)
      .sort((a, b) => a - b);
  }

  const lockedNow = (monat) => isLocked(monat, new Date(), CONFIG.graceDays, CONFIG.tz);
  const canEdit = (monat) => !lockedNow(monat) || !!state.adminPassword;

  let toastTimer;
  function toast(text, isError = false) {
    const t = $('toast');
    t.textContent = text;
    t.classList.toggle('error', isError);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 3500 : 1500);
  }

  async function saveEntry(monat, raum, patch, okText = 'Gespeichert') {
    if (!canEdit(monat)) {
      toast(`${formatMonth(monat)} ist gesperrt und kann nicht mehr geändert werden.`, true);
      renderAll();
      return;
    }
    const entry = { ...entryFor(monat, raum), ...patch };
    entry.kommentar = entry.kommentar.slice(0, MAX_COMMENT);
    try {
      await store.save(monat, raum, entry);
      state.data.entries[monat] ??= {};
      state.data.entries[monat][String(raum)] = entry;
      toast(okText);
    } catch {
      toast('Speichern fehlgeschlagen. Bitte erneut versuchen.', true);
    }
    renderGrid();
    renderComments();
  }

  function toggleOwn(monat, task) {
    if (!state.room) {
      toast('Bitte zuerst oben deinen Proberaum wählen.', true);
      $('room').focus();
      return;
    }
    const raum = state.room;
    const now = !entryFor(monat, raum)[task.key];
    saveEntry(monat, raum, { [task.key]: now },
      now ? `Raum ${raum}: ${task.label} eingetragen` : `Raum ${raum}: ${task.label} entfernt`);
  }

  function renderRoomSelect() {
    const sel = $('room');
    const opts = [new Option('Ich bin: Proberaum wählen', '')];
    for (let i = 1; i <= CONFIG.roomCount; i++) opts.push(new Option(`Ich bin: Proberaum ${i}`, String(i)));
    sel.replaceChildren(...opts);
    sel.value = state.room ? String(state.room) : '';
  }

  function renderHeader() {
    $('notice').hidden = !!state.room;
    $('help').textContent = state.adminPassword
      ? 'Admin: „×" entfernt einen Raum, „+" trägt den oben gewählten Raum ein, auch in gesperrten Monaten.'
      : state.room
        ? `Kachel antippen, um Raum ${state.room} einzutragen oder wieder zu entfernen. Unterstrichen = dein Raum.`
        : 'Die Zahlen auf den Kacheln sind die Proberäume, die die Aufgabe im Monat erledigt haben.';
  }

  function monthState(monat, thisMonth, locked) {
    if (monat === thisMonth) return { cls: 'current', text: 'aktuell' };
    if (!locked) return { cls: 'open', text: `offen bis ${formatDay(lastEditableDay(monat, CONFIG.graceDays))}` };
    return { cls: 'locked', text: state.adminPassword ? 'gesperrt (Admin)' : 'gesperrt 🔒' };
  }

  function chip(r) {
    return el('span', { className: 'chip' + (r === state.room ? ' mine' : '') }, String(r));
  }

  function renderCell(monat, task, locked) {
    const rooms = roomsFor(monat, task.key);
    const td = el('td');
    td.dataset.task = task.key;
    if (rooms.length) td.classList.add('done');

    if (state.adminPassword) {
      const box = el('div', { className: 'cell' });
      for (const r of rooms) {
        const c = chip(r);
        const x = el('button', { type: 'button', textContent: '×' });
        x.setAttribute('aria-label', `Raum ${r} bei ${task.label} ${formatMonth(monat)} entfernen`);
        x.addEventListener('click', () => saveEntry(monat, r, { [task.key]: false }, `Raum ${r} entfernt`));
        c.append(x);
        box.append(c);
      }
      if (state.room && !rooms.includes(state.room)) {
        const add = el('button', { type: 'button', className: 'admin-add', textContent: `+${state.room}` });
        add.setAttribute('aria-label', `Raum ${state.room} bei ${task.label} ${formatMonth(monat)} eintragen`);
        add.addEventListener('click', () => saveEntry(monat, state.room, { [task.key]: true }, `Raum ${state.room} eingetragen`));
        box.append(add);
      }
      if (!box.childElementCount) box.append(el('span', { className: 'dash', textContent: '–' }));
      td.append(box);
      return td;
    }

    if (locked) {
      const box = el('div', { className: 'cell' }, ...rooms.map(chip));
      if (!rooms.length) box.append(el('span', { className: 'dash', textContent: '–' }));
      box.setAttribute('aria-label', `${task.label}, ${formatMonth(monat)}: ${rooms.length ? `Raum ${rooms.join(', ')}` : 'nicht erledigt'}`);
      td.append(box);
      return td;
    }

    const btn = el('button', { type: 'button', className: 'cell' }, ...rooms.map(chip));
    const mine = state.room && rooms.includes(state.room);
    if (!mine) btn.append(el('span', { className: 'add', textContent: '+' }));
    const who = rooms.length ? `erledigt von Raum ${rooms.join(', ')}` : 'noch nicht erledigt';
    const action = !state.room ? 'Erst Proberaum wählen' : mine ? `Antippen entfernt Raum ${state.room}` : `Antippen trägt Raum ${state.room} ein`;
    btn.setAttribute('aria-label', `${task.label}, ${formatMonth(monat)}: ${who}. ${action}.`);
    btn.addEventListener('click', () => toggleOwn(monat, task));
    td.append(btn);
    return td;
  }

  function renderGrid() {
    const now = new Date();
    const thisMonth = currentMonth(now, CONFIG.tz);
    const rows = listMonths(CONFIG.startMonth, now, CONFIG.tz).map((monat) => {
      const locked = isLocked(monat, now, CONFIG.graceDays, CONFIG.tz);
      const st = monthState(monat, thisMonth, locked);
      const [name, year] = formatMonthShort(monat).split(' ');
      const th = el('th', { scope: 'row' },
        el('span', { className: 'm-name', textContent: name }),
        el('span', { className: 'm-year', textContent: year }),
        el('span', { className: `m-state ${st.cls}`, textContent: st.text }));
      const tr = el('tr', {}, th, ...TASKS.map((t) => renderCell(monat, t, locked)));
      tr.dataset.month = monat;
      if (monat === thisMonth) tr.classList.add('current');
      else if (locked) tr.classList.add('locked');
      return tr;
    });
    $('rows').replaceChildren(...rows);
  }

  function renderComments() {
    const items = [];
    for (const monat of listMonths(CONFIG.startMonth, new Date(), CONFIG.tz)) {
      const byRoom = state.data.entries[monat] ?? {};
      Object.keys(byRoom).map(Number).filter((r) => r >= 1 && r <= CONFIG.roomCount).sort((a, b) => a - b)
        .forEach((r) => {
          const text = entryFor(monat, r).kommentar.trim();
          if (text) {
            items.push(el('li', {},
              el('span', { className: 'c-meta', textContent: `${formatMonthShort(monat)} · Raum ${r}` }),
              document.createTextNode(text)));
          }
        });
    }
    $('comments').replaceChildren(...(items.length ? items : [el('p', { className: 'empty', textContent: 'Noch keine Kommentare.' })]));
  }

  // Kommentar-Editor
  let commentTimer;
  let commentSaved = '';
  function renderEditor() {
    const section = $('editorSection');
    section.hidden = !state.room;
    if (!state.room) return;
    const months = listMonths(CONFIG.startMonth, new Date(), CONFIG.tz).filter(canEdit);
    if (!months.includes(state.commentMonth)) state.commentMonth = months[0] ?? null;
    $('commentMonth').replaceChildren(...months.map((m) => new Option(formatMonth(m), m)));
    $('commentMonth').value = state.commentMonth ?? '';
    const text = state.commentMonth ? entryFor(state.commentMonth, state.room).kommentar : '';
    $('comment').value = text;
    commentSaved = text;
    $('commentLabel').textContent = `Kommentar von Raum ${state.room}`;
    $('commentCount').textContent = `${text.length}/${MAX_COMMENT}`;
  }
  function flushComment() {
    clearTimeout(commentTimer);
    const ta = $('comment');
    if (!state.room || !state.commentMonth || ta.value === commentSaved) return;
    commentSaved = ta.value;
    saveEntry(state.commentMonth, state.room, { kommentar: ta.value }, 'Kommentar gespeichert');
  }

  function renderAdmin() {
    const row = $('adminRow');
    if (state.adminPassword) {
      const out = el('button', { type: 'button', className: 'btn', textContent: 'Abmelden' });
      out.addEventListener('click', () => {
        state.adminPassword = null;
        safeSet(sessionStorage, KEY_ADMIN, null);
        renderAll();
      });
      row.replaceChildren(el('span', { className: 'admin-active', textContent: 'Admin-Modus aktiv' }), out);
      return;
    }
    if (!state.adminFormOpen) {
      const btn = el('button', { type: 'button', className: 'btn', textContent: 'Admin' });
      btn.addEventListener('click', () => { state.adminFormOpen = true; renderAdmin(); $('adminPw').focus(); });
      row.replaceChildren(btn);
      return;
    }
    const pw = el('input', { type: 'password', id: 'adminPw', autocomplete: 'current-password', placeholder: 'Admin-Passwort' });
    pw.setAttribute('aria-label', 'Admin-Passwort');
    const cancel = el('button', { type: 'button', className: 'btn', textContent: 'Abbrechen' });
    cancel.addEventListener('click', () => { state.adminFormOpen = false; state.adminError = ''; renderAdmin(); });
    const form = el('form', { className: 'admin-form' }, pw,
      el('button', { type: 'submit', className: 'btn primary', textContent: 'Anmelden' }), cancel);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (await store.checkAdmin(pw.value)) {
        state.adminPassword = pw.value;
        state.adminFormOpen = false; state.adminError = '';
        safeSet(sessionStorage, KEY_ADMIN, pw.value);
        renderAll();
        toast('Admin-Modus aktiv');
      } else {
        state.adminError = 'Passwort falsch.';
        renderAdmin();
      }
    });
    const nodes = [form];
    if (state.adminError) nodes.push(el('p', { className: 'admin-error', textContent: state.adminError }));
    row.replaceChildren(...nodes);
  }

  function renderAll() {
    renderHeader(); renderGrid(); renderEditor(); renderComments(); renderAdmin();
  }

  async function init() {
    const fromUrl = parseRoom(new URLSearchParams(location.search).get('raum'), CONFIG.roomCount);
    state.room = fromUrl ?? parseRoom(safeGet(localStorage, KEY_ROOM), CONFIG.roomCount);
    if (fromUrl) safeSet(localStorage, KEY_ROOM, String(fromUrl));
    state.data = await store.load();
    renderRoomSelect();
    renderAll();

    $('room').addEventListener('change', (ev) => {
      flushComment();
      state.room = parseRoom(ev.target.value, CONFIG.roomCount);
      safeSet(localStorage, KEY_ROOM, state.room ? String(state.room) : null);
      renderAll();
    });
    $('commentMonth').addEventListener('change', (ev) => {
      flushComment();
      state.commentMonth = ev.target.value;
      renderEditor();
    });
    $('comment').addEventListener('input', () => {
      $('commentCount').textContent = `${$('comment').value.length}/${MAX_COMMENT}`;
      clearTimeout(commentTimer);
      commentTimer = setTimeout(flushComment, 600);
    });
    $('comment').addEventListener('blur', flushComment);
  }

  init();
</script>
