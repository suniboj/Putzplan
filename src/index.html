<title>Toilettenplan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: Sticky-Kopf mit eigener Raumwahl, darunter Monats-Tabelle (Zeilen = Monate, Spalten = Aufgaben), dann Kommentare */
  :root {
    --bg: #eef0f2;
    --surface: #ffffff;
    --fg: #1b1f24;
    --muted: #5d6670;
    --line: #d5dae0;
    --accent: #1f6f8b;
    --accent-fg: #ffffff;
    --accent-soft: #e2f0f5;
    --ok: #2f7d4f;
    --ok-soft: #e3f2e8;
    --warn: #8a5a00;
    --warn-soft: #fbf0d9;
    --lock-soft: #e6e8eb;
    --danger: #b3261e;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-plate: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121619; --surface: #1b2125; --fg: #e8ecef; --muted: #9aa5ae; --line: #2e373d;
      --accent: #5fb3cf; --accent-fg: #0d1a20; --accent-soft: #19323c; --ok: #6cc28f; --ok-soft: #1d3326;
      --warn: #e5b45a; --warn-soft: #3a2f1a; --lock-soft: #161b1f; --danger: #f2827a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121619; --surface: #1b2125; --fg: #e8ecef; --muted: #9aa5ae; --line: #2e373d;
    --accent: #5fb3cf; --accent-fg: #0d1a20; --accent-soft: #19323c; --ok: #6cc28f; --ok-soft: #1d3326;
    --warn: #e5b45a; --warn-soft: #3a2f1a; --lock-soft: #161b1f; --danger: #f2827a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    font-size: 16px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
    z-index: 10; background: var(--surface);
  }
  .wrap {
    max-width: 600px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }

  /* Kopf */
  header {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  header .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
  .plate {
    flex: none; min-width: 52px; height: 52px; padding: 0 8px; display: grid; place-items: center;
    border: 2px solid var(--fg); border-radius: 8px;
    font-family: var(--font-plate); font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .plate.empty { border-style: dashed; color: var(--muted); border-color: var(--muted); }
  .head-text { min-width: 0; flex: 1; display: grid; gap: 4px; }
  h1 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  select {
    width: 100%; min-height: 44px; font: inherit; font-size: 17px; font-weight: 600; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px;
  }

  main .wrap { display: grid; gap: 18px; padding-block: 16px 24px; }
  .notice {
    margin: 0; padding: 10px 12px; border-radius: 10px;
    background: var(--warn-soft); color: var(--warn); font-size: 15px;
  }
  .help { margin: 0; color: var(--muted); font-size: 14px; }

  /* Tabelle */
  .grid-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  th, td { border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
  tr:last-child > * { border-bottom: 0; }
  thead th {
    padding: 10px 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    color: var(--muted); background: var(--bg); line-height: 1.2;
  }
  thead th:first-child, tbody th { padding-left: 12px; }
  col.c-month { width: 27%; }
  tbody th { padding-block: 8px; padding-right: 4px; font-weight: 700; font-size: 15px; }
  .m-name { display: block; font-variant-numeric: tabular-nums; }
  .m-state { display: block; font-size: 12px; font-weight: 600; margin-top: 2px; }
  .m-state.current { color: var(--accent); }
  .m-state.open { color: var(--warn); }
  .m-state.locked { color: var(--muted); }
  tr.current > * { background: var(--accent-soft); }
  tr.locked > * { background: var(--lock-soft); }
  td { padding: 4px; }

  .cell {
    width: 100%; min-height: 56px; padding: 6px; display: flex; flex-wrap: wrap; align-content: center;
    gap: 4px; border-radius: 8px;
  }
  button.cell {
    font: inherit; color: var(--fg); background: transparent; border: 1px dashed var(--line); cursor: pointer;
    text-align: left;
  }
  button.cell:hover { border-color: var(--accent); }
  .chip {
    display: inline-flex; align-items: center; gap: 2px; min-height: 28px; padding: 0 8px; border-radius: 999px;
    background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok);
    font-family: var(--font-plate); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .chip.mine { background: var(--ok); color: var(--surface); }
  .add { color: var(--muted); font-size: 22px; line-height: 1; padding: 0 4px; }
  .dash { color: var(--muted); padding-left: 4px; }

  /* Admin-Zelle */
  .chip button, .admin-add {
    font: inherit; border: 0; background: transparent; color: inherit; cursor: pointer; min-height: 28px;
  }
  .chip button { padding: 0 0 0 4px; font-size: 16px; line-height: 1; }
  .admin-add {
    min-width: 44px; min-height: 36px; border: 1px dashed var(--warn); border-radius: 999px; color: var(--warn);
    font-family: var(--font-plate); font-weight: 700;
  }

  /* Kommentare */
  section h2 { margin: 0 0 8px; font-size: 18px; }
  .editor {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px; display: grid; gap: 8px;
  }
  .editor-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; color: var(--muted); }
  .editor-top span { font-variant-numeric: tabular-nums; }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; font: inherit; color: var(--fg);
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .comments li {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px;
    overflow-wrap: anywhere;
  }
  .c-meta { display: block; font-size: 13px; color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); margin: 0; font-size: 15px; }

  textarea:focus-visible, select:focus-visible, button:focus-visible, input:focus-visible {
    outline: 3px solid var(--accent); outline-offset: 2px;
  }

  /* Fuß / Admin */
  footer .wrap { display: grid; gap: 10px; padding-block: 8px 32px; color: var(--muted); font-size: 14px; }
  .proto { margin: 0; }
  .admin-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    min-height: 44px; padding: 0 16px; font: inherit; font-weight: 600; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .admin-form { display: flex; gap: 8px; flex-wrap: wrap; }
  .admin-form input {
    flex: 1 1 160px; min-width: 0; min-height: 44px; font: inherit; color: var(--fg);
    background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 0 12px;
  }
  .admin-active { color: var(--warn); font-weight: 600; }
  .admin-error { color: var(--danger); margin: 0; }

  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    max-width: calc(100% - 32px); padding: 10px 16px; border-radius: 999px;
    background: var(--fg); color: var(--bg); font-weight: 600; font-size: 15px; text-align: center;
    box-shadow: 0 4px 16px rgb(0 0 0 / 0.2); z-index: 20;
  }
  .toast.error { background: var(--danger); color: #fff; }
</style>

<header>
  <div class="wrap">
    <div class="plate empty" id="plate" aria-hidden="true">–</div>
    <div class="head-text">
      <h1>Toilettenplan</h1>
      <select id="room" aria-label="Eigenen Proberaum wählen"></select>
    </div>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="notice" id="notice" hidden>Wähle oben deinen Proberaum, um etwas einzutragen.</p>
    <div class="grid-box">
      <table>
        <colgroup><col class="c-month"><col><col><col></colgroup>
        <thead>
          <tr><th scope="col">Monat</th><th scope="col">Putzen</th><th scope="col">Müll raus</th><th scope="col">Putz&shy;zeug</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="help" id="help"></p>

    <section id="editorSection" hidden>
      <h2>Dein Kommentar</h2>
      <div class="editor">
        <select id="commentMonth" aria-label="Monat für Kommentar"></select>
        <div class="editor-top"><label for="comment" id="commentLabel">Kommentar</label><span id="commentCount"></span></div>
        <textarea id="comment" maxlength="200" rows="2" placeholder="z. B. Klopapier fast leer"></textarea>
      </div>
    </section>

    <section>
      <h2>Kommentare</h2>
      <ul class="comments" id="comments"></ul>
    </section>
  </div>
</main>

<footer>
  <div class="wrap">
    <p class="proto">Prototyp: Einträge werden nur auf diesem Gerät gespeichert.</p>
    <div class="admin-row" id="adminRow"></div>
  </div>
</footer>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module">
  import {
    currentMonth, lastEditableDay, isLocked, listMonths, formatMonth, formatMonthShort, formatDay, parseRoom,
  } from './lock.js';

  const CONFIG = { roomCount: 30, startMonth: '2026-11', graceDays: 5, tz: 'Europe/Berlin' };
  const TASKS = [
    { key: 'putzen', label: 'Putzen' },
    { key: 'muell', label: 'Müll rausbringen' },
    { key: 'putzzeug', label: 'Putzzeug kaufen' },
  ];
  const MAX_COMMENT = 200;
  const KEY_DATA = 'putzplan-data';
  const KEY_ROOM = 'putzplan-raum';
  const KEY_ADMIN = 'putzplan-admin';

  // Speicherschicht. Phase 1: localStorage. Phase 3: wird durch API-Aufrufe ersetzt.
  const store = {
    async load() {
      try {
        const raw = localStorage.getItem(KEY_DATA);
        const data = raw ? JSON.parse(raw) : null;
        if (data && data.version === 1 && data.entries && typeof data.entries === 'object') return data;
      } catch { /* Speicher nicht verfügbar */ }
      return { version: 1, entries: {} };
    },
    async save(monat, raum, entry) {
      const data = await this.load();
      data.entries[monat] ??= {};
      data.entries[monat][String(raum)] = entry;
      localStorage.setItem(KEY_DATA, JSON.stringify(data)); // wirft, wenn blockiert
    },
    async checkAdmin(password) {
      return password === 'admin'; // Platzhalter, in Phase 4 serverseitig geprüft
    },
  };

  const safeGet = (s, k) => { try { return s.getItem(k); } catch { return null; } };
  const safeSet = (s, k, v) => { try { v == null ? s.removeItem(k) : s.setItem(k, v); } catch { /* ignorieren */ } };
  const $ = (id) => document.getElementById(id);
  const el = (tag, props = {}, ...children) => {
    const n = Object.assign(document.createElement(tag), props);
    n.append(...children);
    return n;
  };

  const state = {
    data: { version: 1, entries: {} },
    room: null,
    adminPassword: safeGet(sessionStorage, KEY_ADMIN),
    adminFormOpen: false,
    adminError: '',
    commentMonth: null,
  };

  function entryFor(monat, raum) {
    const e = state.data.entries[monat]?.[String(raum)] ?? {};
    return {
      putzen: e.putzen === true, muell: e.muell === true, putzzeug: e.putzzeug === true,
      kommentar: typeof e.kommentar === 'string' ? e.kommentar : '',
    };
  }

  /** Räume (aufsteigend), die im Monat die Aufgabe erledigt haben. */
  function roomsFor(monat, key) {
    return Object.entries(state.data.entries[monat] ?? {})
      .filter(([, e]) => e && e[key] === true)
      .map(([r]) => Number(r))
      .filter((r) => r >= 1 && r <= CONFIG.roomCount)
      .sort((a, b) => a - b);
  }

  const lockedNow = (monat) => isLocked(monat, new Date(), CONFIG.graceDays, CONFIG.tz);
  const canEdit = (monat) => !lockedNow(monat) || !!state.adminPassword;

  let toastTimer;
  function toast(text, isError = false) {
    const t = $('toast');
    t.textContent = text;
    t.classList.toggle('error', isError);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, isError ? 3500 : 1500);
  }

  async function saveEntry(monat, raum, patch, okText = 'Gespeichert') {
    if (!canEdit(monat)) {
      toast(`${formatMonth(monat)} ist gesperrt und kann nicht mehr geändert werden.`, true);
      renderAll();
      return;
    }
    const entry = { ...entryFor(monat, raum), ...patch };
    entry.kommentar = entry.kommentar.slice(0, MAX_COMMENT);
    try {
      await store.save(monat, raum, entry);
      state.data.entries[monat] ??= {};
      state.data.entries[monat][String(raum)] = entry;
      toast(okText);
    } catch {
      toast('Speichern fehlgeschlagen. Bitte erneut versuchen.', true);
    }
    renderGrid();
    renderComments();
  }

  function toggleOwn(monat, task) {
    if (!state.room) {
      toast('Bitte zuerst oben deinen Proberaum wählen.', true);
      $('room').focus();
      return;
    }
    const raum = state.room;
    const now = !entryFor(monat, raum)[task.key];
    saveEntry(monat, raum, { [task.key]: now },
      now ? `Raum ${raum}: ${task.label} eingetragen` : `Raum ${raum}: ${task.label} entfernt`);
  }

  function renderRoomSelect() {
    const sel = $('room');
    const opts = [new Option('Ich bin: Proberaum wählen', '')];
    for (let i = 1; i <= CONFIG.roomCount; i++) opts.push(new Option(`Ich bin: Proberaum ${i}`, String(i)));
    sel.replaceChildren(...opts);
    sel.value = state.room ? String(state.room) : '';
  }

  function renderHeader() {
    const plate = $('plate');
    plate.textContent = state.room ? String(state.room) : '–';
    plate.classList.toggle('empty', !state.room);
    $('notice').hidden = !!state.room;
    $('help').textContent = state.adminPassword
      ? 'Admin: „×" entfernt einen Raum, „+" trägt den oben gewählten Raum ein – auch in gesperrten Monaten.'
      : state.room
        ? `Zelle antippen, um Raum ${state.room} einzutragen oder wieder zu entfernen.`
        : 'Die Zahlen sind die Proberäume, die die Aufgabe im Monat erledigt haben.';
  }

  function monthState(monat, thisMonth, locked) {
    if (monat === thisMonth) return { cls: 'current', text: 'aktuell' };
    if (!locked) return { cls: 'open', text: `offen bis ${formatDay(lastEditableDay(monat, CONFIG.graceDays))}` };
    return { cls: 'locked', text: state.adminPassword ? 'gesperrt (Admin)' : 'gesperrt 🔒' };
  }

  function chip(r) {
    return el('span', { className: 'chip' + (r === state.room ? ' mine' : '') }, String(r));
  }

  function renderCell(monat, task, locked) {
    const rooms = roomsFor(monat, task.key);
    const td = el('td');

    if (state.adminPassword) {
      const box = el('div', { className: 'cell' });
      for (const r of rooms) {
        const c = chip(r);
        const x = el('button', { type: 'button', textContent: '×' });
        x.setAttribute('aria-label', `Raum ${r} bei ${task.label} ${formatMonth(monat)} entfernen`);
        x.addEventListener('click', () => saveEntry(monat, r, { [task.key]: false }, `Raum ${r} entfernt`));
        c.append(x);
        box.append(c);
      }
      if (state.room && !rooms.includes(state.room)) {
        const add = el('button', { type: 'button', className: 'admin-add', textContent: `+${state.room}` });
        add.setAttribute('aria-label', `Raum ${state.room} bei ${task.label} ${formatMonth(monat)} eintragen`);
        add.addEventListener('click', () => saveEntry(monat, state.room, { [task.key]: true }, `Raum ${state.room} eingetragen`));
        box.append(add);
      }
      if (!box.childElementCount) box.append(el('span', { className: 'dash', textContent: '–' }));
      td.append(box);
      return td;
    }

    if (locked) {
      const box = el('div', { className: 'cell' }, ...rooms.map(chip));
      if (!rooms.length) box.append(el('span', { className: 'dash', textContent: '–' }));
      td.append(box);
      return td;
    }

    const btn = el('button', { type: 'button', className: 'cell' }, ...rooms.map(chip));
    const mine = state.room && rooms.includes(state.room);
    if (!mine) btn.append(el('span', { className: 'add', textContent: '+' }));
    const who = rooms.length ? `erledigt von Raum ${rooms.join(', ')}` : 'noch nicht erledigt';
    const action = !state.room ? 'Erst Proberaum wählen' : mine ? `Antippen entfernt Raum ${state.room}` : `Antippen trägt Raum ${state.room} ein`;
    btn.setAttribute('aria-label', `${task.label}, ${formatMonth(monat)}: ${who}. ${action}.`);
    btn.dataset.cell = `${monat}-${task.key}`;
    btn.addEventListener('click', () => toggleOwn(monat, task));
    td.append(btn);
    return td;
  }

  function renderGrid() {
    const now = new Date();
    const thisMonth = currentMonth(now, CONFIG.tz);
    const rows = listMonths(CONFIG.startMonth, now, CONFIG.tz).map((monat) => {
      const locked = isLocked(monat, now, CONFIG.graceDays, CONFIG.tz);
      const st = monthState(monat, thisMonth, locked);
      const th = el('th', { scope: 'row' },
        el('span', { className: 'm-name', textContent: formatMonthShort(monat) }),
        el('span', { className: `m-state ${st.cls}`, textContent: st.text }));
      const tr = el('tr', {}, th, ...TASKS.map((t) => renderCell(monat, t, locked)));
      tr.dataset.month = monat;
      if (monat === thisMonth) tr.classList.add('current');
      else if (locked) tr.classList.add('locked');
      return tr;
    });
    $('rows').replaceChildren(...rows);
  }

  function renderComments() {
    const items = [];
    for (const monat of listMonths(CONFIG.startMonth, new Date(), CONFIG.tz)) {
      const byRoom = state.data.entries[monat] ?? {};
      Object.keys(byRoom).map(Number).filter((r) => r >= 1 && r <= CONFIG.roomCount).sort((a, b) => a - b)
        .forEach((r) => {
          const text = entryFor(monat, r).kommentar.trim();
          if (text) {
            items.push(el('li', {},
              el('span', { className: 'c-meta', textContent: `${formatMonthShort(monat)} · Raum ${r}` }),
              document.createTextNode(text)));
          }
        });
    }
    $('comments').replaceChildren(...(items.length ? items : [el('p', { className: 'empty', textContent: 'Noch keine Kommentare.' })]));
  }

  // Kommentar-Editor
  let commentTimer;
  let commentSaved = '';
  function renderEditor() {
    const section = $('editorSection');
    section.hidden = !state.room;
    if (!state.room) return;
    const months = listMonths(CONFIG.startMonth, new Date(), CONFIG.tz).filter(canEdit);
    if (!months.includes(state.commentMonth)) state.commentMonth = months[0] ?? null;
    $('commentMonth').replaceChildren(...months.map((m) => new Option(formatMonth(m), m)));
    $('commentMonth').value = state.commentMonth ?? '';
    const text = state.commentMonth ? entryFor(state.commentMonth, state.room).kommentar : '';
    $('comment').value = text;
    commentSaved = text;
    $('commentLabel').textContent = `Kommentar von Raum ${state.room}`;
    $('commentCount').textContent = `${text.length}/${MAX_COMMENT}`;
  }
  function flushComment() {
    clearTimeout(commentTimer);
    const ta = $('comment');
    if (!state.room || !state.commentMonth || ta.value === commentSaved) return;
    commentSaved = ta.value;
    saveEntry(state.commentMonth, state.room, { kommentar: ta.value }, 'Kommentar gespeichert');
  }

  function renderAdmin() {
    const row = $('adminRow');
    if (state.adminPassword) {
      const out = el('button', { type: 'button', className: 'btn', textContent: 'Abmelden' });
      out.addEventListener('click', () => {
        state.adminPassword = null;
        safeSet(sessionStorage, KEY_ADMIN, null);
        renderAll();
      });
      row.replaceChildren(el('span', { className: 'admin-active', textContent: 'Admin-Modus aktiv' }), out);
      return;
    }
    if (!state.adminFormOpen) {
      const btn = el('button', { type: 'button', className: 'btn', textContent: 'Admin' });
      btn.addEventListener('click', () => { state.adminFormOpen = true; renderAdmin(); $('adminPw').focus(); });
      row.replaceChildren(btn);
      return;
    }
    const pw = el('input', { type: 'password', id: 'adminPw', autocomplete: 'current-password', placeholder: 'Admin-Passwort' });
    pw.setAttribute('aria-label', 'Admin-Passwort');
    const cancel = el('button', { type: 'button', className: 'btn', textContent: 'Abbrechen' });
    cancel.addEventListener('click', () => { state.adminFormOpen = false; state.adminError = ''; renderAdmin(); });
    const form = el('form', { className: 'admin-form' }, pw,
      el('button', { type: 'submit', className: 'btn primary', textContent: 'Anmelden' }), cancel);
    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      if (await store.checkAdmin(pw.value)) {
        state.adminPassword = pw.value;
        state.adminFormOpen = false; state.adminError = '';
        safeSet(sessionStorage, KEY_ADMIN, pw.value);
        renderAll();
        toast('Admin-Modus aktiv');
      } else {
        state.adminError = 'Passwort falsch.';
        renderAdmin();
      }
    });
    const nodes = [form];
    if (state.adminError) nodes.push(el('p', { className: 'admin-error', textContent: state.adminError }));
    row.replaceChildren(...nodes);
  }

  function renderAll() {
    renderHeader(); renderGrid(); renderEditor(); renderComments(); renderAdmin();
  }

  async function init() {
    const fromUrl = parseRoom(new URLSearchParams(location.search).get('raum'), CONFIG.roomCount);
    state.room = fromUrl ?? parseRoom(safeGet(localStorage, KEY_ROOM), CONFIG.roomCount);
    if (fromUrl) safeSet(localStorage, KEY_ROOM, String(fromUrl));
    state.data = await store.load();
    renderRoomSelect();
    renderAll();

    $('room').addEventListener('change', (ev) => {
      flushComment();
      state.room = parseRoom(ev.target.value, CONFIG.roomCount);
      safeSet(localStorage, KEY_ROOM, state.room ? String(state.room) : null);
      renderAll();
    });
    $('commentMonth').addEventListener('change', (ev) => {
      flushComment();
      state.commentMonth = ev.target.value;
      renderEditor();
    });
    $('comment').addEventListener('input', () => {
      $('commentCount').textContent = `${$('comment').value.length}/${MAX_COMMENT}`;
      clearTimeout(commentTimer);
      commentTimer = setTimeout(flushComment, 600);
    });
    $('comment').addEventListener('blur', flushComment);
  }

  init();
</script>
